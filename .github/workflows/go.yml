name: Go

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - &fast-clone
        name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # golangci-lint's `unused` does not report exported declarations, which is
      # how a dead request printer and an unimplemented Logger interface lived in
      # the tree unnoticed. Reachability analysis does, and everything under
      # internal/ is ours, so an unreachable function there is dead code.
      - name: Check for dead code
        run: |
          go run golang.org/x/tools/cmd/deadcode@v0.49.0 \
            -test -filter '^github.com/evg4b/uncors/internal/' ./... | tee /dev/stderr | (! grep -q .)

  test:
    name: Test code
    runs-on: ubuntu-latest
    steps:
      - *fast-clone

      - &setup-go
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -tags release -timeout 1m -race -v -coverprofile=coverage.out ./...

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.out

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - *fast-clone

      - *setup-go

      - name: Integration tests
        run: go test -tags integration -timeout 5m -race ./tests/integration/...

  build:
    name: Build code
    runs-on: ubuntu-latest
    steps:
      - *fast-clone

      - *setup-go

      - name: Build
        run: go build -tags release -v .

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - *fast-clone

      - *setup-go

      # The published image is a documented installation method that no unit
      # test covers. It has been unusable before — bound to loopback inside its
      # own network namespace, starting a full-screen TUI against a pipe — so it
      # is built and actually driven here.
      - name: Build the image
        run: |
          CGO_ENABLED=0 go build -tags release -o uncors .
          docker build -t uncors:ci .

      - name: Proxy a request through the container
        run: |
          docker run --rm -d --name uncors-ci -p 3000:3000 \
            --add-host proxied.local:127.0.0.1 \
            uncors:ci --from 'http://proxied.local:3000' --to 'https://example.com'

          for _ in $(seq 1 30); do
            if curl -fsS -H 'Host: proxied.local' http://127.0.0.1:3000/ -o /dev/null; then
              echo "the container served a proxied request"
              docker rm -f uncors-ci
              exit 0
            fi
            sleep 1
          done

          echo "the container never served a request"
          docker logs uncors-ci
          docker rm -f uncors-ci
          exit 1

  sonar-scan:
    name: SonarCloud Scan
    needs: [ test, build, lint, docker ]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - *fast-clone

      - name: Download code coverage
        uses: actions/download-artifact@v8
        with:
          name: code-coverage
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  code-ql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
